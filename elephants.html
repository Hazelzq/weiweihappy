<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>if (window.top === window.self && !/[?&]solo/.test(location.search)) location.replace('index.html#elephants');</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>跟着小象走一走 · 游园灯</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/grove-bg.jpg" as="image">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/grove.css">
</head>
<body>
<main class="grove" id="grove">
  <canvas class="grove-canvas" id="groveCanvas" aria-hidden="true"></canvas>
  <canvas class="snow-canvas" id="snowCanvas" aria-hidden="true"></canvas>

  <header class="grove-head">
    <h1 class="grove-title">跟着小象走一走</h1>
    <p class="grove-sub">八只小象绕着大树散步。点一只，读读它今天的日记。</p>
  </header>

  <nav class="grove-nav" aria-label="页面导航">
    <a class="nav-pill" href="map.html"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>回到地图</a>
    <a class="nav-pill next" href="qianfu.html">下一页<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
  </nav>

  <!-- 小象右边的小唱片机：一圈字绕着它慢慢转，点它进入第四页“潜伏手账”。位置由 grove-app.js 按画面算出来。 -->
  <a class="gramo" id="zuolanTag" href="qianfu.html" aria-label="我和你一起爱左蓝：去第四页，潜伏手账">
    <svg viewBox="0 0 160 160" aria-hidden="true">
      <defs>
        <path id="gramoRing" d="M80 80m-64 0a64 64 0 1 1 128 0a64 64 0 1 1-128 0"/>
        <linearGradient id="gBrass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f4e2a8"/><stop offset=".45" stop-color="#c8a254"/><stop offset="1" stop-color="#7a5a22"/>
        </linearGradient>
        <radialGradient id="gThroat" cx=".55" cy=".6" r=".6">
          <stop offset="0" stop-color="#3a2a10"/><stop offset=".6" stop-color="#8a6a2c"/><stop offset="1" stop-color="#d9bd78"/>
        </radialGradient>
        <linearGradient id="gWood" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stop-color="#6a3520"/><stop offset="1" stop-color="#3a1a0e"/>
        </linearGradient>
      </defs>
      <g class="gramo-ring">
        <text><textPath href="#gramoRing" textLength="380" lengthAdjust="spacing">我和你一起爱左蓝 ✦ 我和你一起爱左蓝 ✦</textPath></text>
      </g>
      <g class="gramo-body">
        <!-- 小方桌 -->
        <rect x="54" y="114" width="54" height="5" rx="1.5" fill="url(#gWood)"/>
        <rect x="58" y="119" width="46" height="8" fill="#4a2214"/>
        <rect x="76" y="121" width="10" height="2" rx="1" fill="#d6b56a"/>
        <path d="M60 127v16M102 127v16" stroke="#3a1a0e" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M60 138h42" stroke="#3a1a0e" stroke-width="2"/>
        <!-- 机身 -->
        <rect x="56" y="94" width="50" height="20" rx="2" fill="url(#gWood)"/>
        <rect x="61" y="98" width="24" height="6" rx="1" fill="#2a120a"/>
        <rect x="64" y="106" width="18" height="5" rx="1" fill="#e8d39a"/>
        <circle cx="90" cy="104" r="3" fill="#c8a254"/><circle cx="98" cy="104" r="3" fill="#c8a254"/>
        <!-- 唱片和唱臂 -->
        <ellipse class="gramo-disc" cx="78" cy="93.5" rx="17" ry="3.2" fill="#141414"/>
        <ellipse cx="78" cy="93.5" rx="4" ry="1" fill="#b5302a"/>
        <path d="M102 92l-14 1.5" stroke="#c8a254" stroke-width="1.6" stroke-linecap="round"/>
        <!-- 喇叭：铜管从机身后面弯上来，喇叭口像一朵花 -->
        <path d="M92 93C97 80 95 62 89 53" fill="none" stroke="url(#gBrass)" stroke-width="4.6" stroke-linecap="round"/>
        <g class="gramo-horn" transform="rotate(-28 64 48)">
          <path d="M84 64 C76 58 72 54 70 50" fill="none" stroke="url(#gBrass)" stroke-width="7" stroke-linecap="round"/>
          <path fill="url(#gBrass)" stroke="#8a6a2c" stroke-width=".8" d="
            M64 22 C70 18 78 20 80 27 C87 26 92 32 90 39 C96 42 96 51 90 54
            C91 61 84 66 78 63 C75 70 66 71 62 65 C55 68 48 63 49 56
            C42 54 40 45 46 41 C43 34 48 27 55 28 C56 22 60 20 64 22 Z"/>
          <ellipse cx="68" cy="45" rx="15" ry="13" fill="url(#gThroat)"/>
          <path d="M68 45L64 23M68 45L80 28M68 45L90 40M68 45L89 55M68 45L77 63M68 45L62 65M68 45L49 56M68 45L46 41M68 45L55 28" stroke="#8a6a2c" stroke-width=".7" opacity=".7"/>
          <ellipse cx="68" cy="45" rx="5" ry="4.4" fill="#2a1d08"/>
        </g>
      </g>
    </svg>
  </a>

  <!-- 每只小象上面有一个透明按钮，跟着它一起走，可以点、也可以用 Tab 键选中。 -->
  <div class="herd" id="herd" role="group" aria-label="八只小象"></div>

  <output class="grove-loading" id="groveLoading">小象们正在排队…</output>
</main>

<div class="diary-root" id="diaryRoot" hidden>
  <div class="diary-veil" data-close></div>
  <div class="diary-wrap">
    <article class="diary" id="diary" role="dialog" aria-modal="true" aria-labelledby="diaryName">
      <p class="diary-tab"><i class="tab-crown" id="tabCrown" aria-hidden="true"></i><span id="diaryName"></span></p>
      <button type="button" class="diary-close" data-close aria-label="合上日记"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      <div class="diary-page" id="diaryPage">
        <div class="diary-paper" id="diaryPaper"></div>
        <figure class="diary-photo" id="diaryPhoto"></figure>
      </div>
    </article>
    <nav class="diary-pager" aria-label="翻日记">
      <button type="button" id="diaryPrev"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>前一篇</button>
      <span id="diaryCount">1 / 2</span>
      <button type="button" id="diaryNext">后一篇<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </nav>
  </div>
</div>

<script type="module" src="js/grove-app.js"></script>
</body>
</html>
