<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>if (window.top === window.self && !/[?&]solo/.test(location.search)) location.replace('index.html#map');</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我们走过的地图 · 游园灯</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/map.css">
</head>
<body>
<main class="atlas" id="atlas">
  <img class="desk-bg" src="assets/desk.jpg" alt="" aria-hidden="true" draggable="false">
  <header class="atlas-head">
    <h1 class="atlas-title">我们走过的地图</h1>
    <p class="atlas-count" id="count">还没有记下地方</p>
  </header>
  <nav class="atlas-nav" aria-label="页面导航">
    <a class="nav-pill" href="carousel.html"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>回到旋转木马</a>
    <a class="nav-pill" href="elephants.html">下一页<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
  </nav>

  <div id="scene" class="atlas-scene" aria-label="一本摊开的三维册子：左页是植物标本，右页是地图；点击相片卡或标本查看地点"></div>
  <output class="loading" id="loading">正在翻开册子…</output>
  <div class="flash" id="flash" aria-hidden="true"></div>
  <button type="button" class="skip-intro" id="skipIntro" hidden>点击任意处跳过</button>

  <div class="place-banner" id="placeBanner" role="status" hidden>
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg><span id="placeText">在右页地图上点一下这个地方</span>
    <button type="button" class="btn btn-ghost" id="cancelPlace">取消</button>
  </div>

  <aside class="stop-card" id="stopCard" aria-labelledby="stopTitle" hidden>
    <button type="button" class="btn btn-ghost btn-icon-sm stop-close" id="closeStop" aria-label="关闭"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <div class="stop-photo" id="stopPhotoBox"><img id="stopImg" alt=""></div>
    <p class="stop-meta"><span class="stop-seal" id="stopSeal" hidden></span><span id="stopMeta">第 1 站 / 共 1 站</span></p>
    <h2 id="stopTitle"></h2>
    <p class="stop-note" id="stopNote"></p>
    <div class="stop-steps" id="stopSteps">
      <button type="button" class="btn btn-ghost" id="prevStop"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>上一站</button>
      <button type="button" class="btn btn-ghost" id="nextStop">下一站<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="stop-actions">
      <button type="button" class="btn btn-ghost" id="editStop"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>编辑</button>
      <button type="button" class="btn btn-ghost" id="moveStop"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="m15 19-3 3-3-3"/><path d="m19 9 3 3-3 3"/><path d="M2 12h20"/><path d="m5 9-3 3 3 3"/><path d="m9 5 3-3 3 3"/></svg>移动位置</button>
      <button type="button" class="btn btn-ghost danger" id="deleteStop"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg><span id="deleteLabel">删除</span></button>
    </div>
  </aside>

  <div class="open-bar" id="openBar" hidden>
    <button type="button" class="btn btn-default" id="openBtn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>翻开册子</button>
    <span>小象册子嘻嘻嘻</span>
  </div>
  <p class="atlas-hint" id="emptyHint" hidden>点「添加地点」，在右页地图上点一下，放下第一张照片；左页会夹上一片叶子。</p>

  <footer class="bottom">
    <div class="toolbar">
      <button type="button" class="btn btn-default upload" id="addBtn" disabled><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>添加地点</button>
      <button type="button" class="btn btn-ghost" id="baseBtn" disabled><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>更换地图</button>
      <button type="button" class="btn btn-ghost" id="closeBtn" disabled><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg>合上册子</button>
      <button type="button" class="btn btn-ghost reset" id="resetBtn" aria-label="重置视角" disabled><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
    </div>
    <p class="save-status" id="saveStatus" aria-live="polite" hidden></p>
    <a class="walk-link" href="elephants.html"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.5 6.5c-3.6 0-6.5 2.4-6.5 5.6 0 1.6.7 2.9 1.8 3.9V19a.9.9 0 0 0 .9.9h1.2a.9.9 0 0 0 .9-.9v-1.6c.6.2 1.3.3 2 .3h1.4v1.3a.9.9 0 0 0 .9.9h1.2a.9.9 0 0 0 .9-.9v-2.3c.8-.6 1.4-1.4 1.7-2.3.5.2 1 .9 1.1 1.8.1 1.2.8 2.1 2 2.1.9 0 1.5-.6 1.5-1.3 0-.4-.3-.7-.7-.7-.3 0-.4.2-.6.2-.4 0-.6-.4-.7-1.1-.2-2.2-1.2-3.8-2.7-4.6C14.4 7.9 12.2 6.5 9.5 6.5Z"/><circle cx="14.2" cy="10.6" r=".9" fill="#f7f2e6"/></svg>跟着小象走一走</a>
  </footer>
</main>

<div class="dialog-root" id="pinDialog" hidden>
  <div class="dialog-overlay" data-close></div>
  <div class="dialog-popup photo-editor pin-editor" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
    <div class="dialog-header">
      <h2 class="dialog-title" data-slot="dialog-title" id="pinTitle">记下这个地方</h2>
      <p class="dialog-description" data-slot="dialog-description">放一张照片，写下地点名称吧~</p>
    </div>
    <div class="editor-layout">
      <div class="crop-stage">
        <img id="pinPreview" class="pin-preview" alt="地点照片预览" hidden>
        <div class="empty-preview pin-empty" id="pinEmpty"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/></svg><p id="pinEmptyText">选一张这里的照片</p></div>
      </div>
      <div class="crop-controls">
        <button type="button" class="btn btn-outline" id="pinPhotoBtn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/></svg><span id="pinPhotoLabel">选择照片</span></button>
        <p>JPG、PNG、WebP · 最大 50 MB</p>
        <label><span id="pinNameLabel">地点名称</span><input class="text-field" id="pinName" maxlength="16" placeholder="例如：乌镇" autocomplete="off"></label>
        <label><span>那天的事（选填）</span><textarea class="text-field" id="pinNote" maxlength="120" rows="3" placeholder="一句话记下当时的样子"></textarea></label>
      </div>
    </div>
    <p class="editor-error" role="alert" id="pinError" hidden></p>
    <div class="editor-footer">
      <button type="button" class="btn btn-ghost" id="pinCancel">取消</button>
      <button type="button" class="btn btn-default" id="pinSave"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span id="pinSaveLabel">夹进书里</span></button>
    </div>
    <input type="file" id="pinFile" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif" hidden>
    <button type="button" class="btn btn-ghost btn-icon-sm dialog-close" data-close aria-label="关闭"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
</div>

<div class="dialog-root" id="baseDialog" hidden>
  <div class="dialog-overlay" data-close></div>
  <div class="dialog-popup upload-menu" role="dialog" aria-modal="true" aria-labelledby="baseTitle" aria-describedby="baseDesc">
    <div class="dialog-header">
      <h2 class="dialog-title" id="baseTitle">更换右页地图</h2>
      <p class="dialog-description" id="baseDesc">可以换成一张真实地图的截图，比如你们走过的城市或路线。左页标本和已放好的地点不变；出生地的红灯笼可用「移动位置」挪到对应处。</p>
    </div>
    <button type="button" class="btn btn-default batch-upload" id="baseChoose"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>选择地图图片</button>
    <button type="button" class="btn btn-default" id="baseDefault">换回水墨地图</button>
    <p class="batch-help">竖向图片效果最好（约 3 : 4）。JPG、PNG、WebP · 最大 50 MB</p>
    <p class="editor-error" role="alert" id="baseError" hidden></p>
    <input type="file" id="baseFile" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" hidden>
    <button type="button" class="btn btn-ghost btn-icon-sm dialog-close" data-close aria-label="关闭"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
</div>

<output aria-live="polite" class="toast" id="toast"></output>
<script src="js/boot.js" data-entry="js/map-app.js"></script>
</body>
</html>
